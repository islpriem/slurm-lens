<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<script>
			// dark mode from the settings before the first paint, so the page does not flash white
			const settings = JSON.parse(localStorage.getItem('slurm-lens') ?? '{}');
			document.documentElement.classList.toggle('dark', settings.dark === true);
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
