; slurm-lens configuration, on the VM in /etc/slurm-lens/slurm-lens.ini
; secrets are not kept here: the Slurm token is read from token_file (or SLURM_JWT),
; the database password from SLURM_LENS_DB_PASSWORD

[slurm]
url = https://api.hpc.sci.hpi.de
token_file = /etc/slurm-lens/token

[database]
url = postgresql+psycopg://slurm_lens@db:5432/slurm_lens

[collector]
interval_minutes = 5
fairshare_minutes = 60

