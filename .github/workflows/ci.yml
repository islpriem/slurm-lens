name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: slurm_lens
          POSTGRES_PASSWORD: slurm_lens
          POSTGRES_DB: slurm_lens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U slurm_lens"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
