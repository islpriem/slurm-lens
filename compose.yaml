x-app: &app
  build: .
  environment:
    SLURM_LENS_CONFIG: /etc/slurm-lens/slurm-lens.ini
    SLURM_LENS_DB_PASSWORD: ${SLURM_LENS_DB_PASSWORD}
  volumes:
    - /etc/slurm-lens:/etc/slurm-lens:ro
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: slurm_lens
      POSTGRES_DB: slurm_lens
      POSTGRES_PASSWORD: ${SLURM_LENS_DB_PASSWORD:?set SLURM_LENS_DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    # only reachable from the host itself (psql, backups, ssh tunnel)
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "slurm_lens"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  collector:
    <<: *app
    command: ["collect"]
    healthcheck:
      test: ["CMD", "slurm-lens", "status"]
      interval: 5m
      start_period: 10m

  web:
    <<: *app
    command: ["serve", "--host", "0.0.0.0", "--web", "/app/web"]
    # behind the reverse proxy of the VM
    ports:
      - 0.0.0.0:8000:8000

volumes:
  db:
