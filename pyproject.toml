[project]
name = "slurm-lens"
version = "0.1.0"
description = "Collects Slurm scheduling data to explain how jobs get scheduled"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["click", "httpx"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
